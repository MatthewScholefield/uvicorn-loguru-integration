[project]
name = "example-fastapi-reload"
version = "0.0.0"
description = "Example FastAPI app using uvicorn-loguru-integration"
requires-python = ">=3.8"
dependencies = [
  "fastapi",
  "uvicorn",
  "loguru",
  "uvicorn-loguru-integration",
]

[tool.uv.sources]
uvicorn-loguru-integration = { path = ".." }

[tool.uv]
managed = true
